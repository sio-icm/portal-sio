# /etc/nginx/conf.d/sio.conf (Nginx del servidor docker03), versión SIN HTTPS.
# Para pasar a la instalación nueva mientras no llega el certificado.
# Cuando llegue, sustituir por deploy/nginx-sio.conf.
server {
    listen 80;
    listen [::]:80;
    server_name sio.icm.csic.es 10.100.201.12;
    client_max_body_size 2m;

    # Enlaces antiguos /portal-sio/... -> /...
    location /portal-sio/ {
        rewrite ^/portal-sio/(.*)$ /$1 permanent;
    }

    # Todo va al contenedor del frontend (docker-compose.yml, puerto 8082)
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
