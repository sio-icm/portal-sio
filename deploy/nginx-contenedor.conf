# Nginx dentro del contenedor del frontend.
# Delante está el Nginx del servidor (deploy/nginx-sio.conf), que pone el HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # DNS interno de Docker: se vuelve a preguntar la dirección del backend cada
    # 10 s, por si cambia al recrear su contenedor (si no, Nginx se queda la vieja)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: al contenedor del backend (nombre del servicio en docker-compose.yml)
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # Se reenvían tal cual las cabeceras del Nginx del servidor (IP real del usuario)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Archivos generados por Vite (llevan hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación Vue: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
