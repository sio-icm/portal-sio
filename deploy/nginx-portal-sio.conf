# Plantilla de Nginx para el portal del SIO (sio.icm.csic.es)
#
# - Sirve el build de Vite (npm run build -> dist/) desde la raíz
# - Pasa /api/ al backend Flask, que solo escucha en 127.0.0.1:5000
# - Redirige http a https
#
# Antes de usarla, cambiar:
#   RUTA_DIST         carpeta donde se copia dist/ en el servidor
#   RUTA_CERTIFICADO  certificado y clave que proporcione Informática

server {
    listen 80;
    server_name sio.icm.csic.es 10.100.201.12;
    return 301 https://sio.icm.csic.es$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sio.icm.csic.es;

    ssl_certificate     RUTA_CERTIFICADO/fullchain.pem;
    ssl_certificate_key RUTA_CERTIFICADO/privkey.pem;

    root RUTA_DIST;
    index index.html;

    # Backend: el puerto 5000 no se abre fuera del servidor
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos generados por Vite (llevan hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación Vue: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
