# /etc/nginx/conf.d/sio.conf (Nginx del servidor docker03), versión FINAL CON HTTPS.
#
# Certificado (lo envía Informática): copiarlo con estos nombres
#   /etc/pki/nginx/sio.icm.csic.es.crt
#   /etc/pki/nginx/private/sio.icm.csic.es.key
# y ejecutar  sudo restorecon -Rv /etc/pki/nginx  (SELinux). Ver README.

# http -> https (también si se entra por la IP)
server {
    listen 80;
    listen [::]:80;
    server_name sio.icm.csic.es 10.100.201.12;
    return 301 https://sio.icm.csic.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sio.icm.csic.es;

    ssl_certificate     /etc/pki/nginx/sio.icm.csic.es.crt;
    ssl_certificate_key /etc/pki/nginx/private/sio.icm.csic.es.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 40m;  # fotos del diario de actividad

    # Enlaces antiguos /portal-sio/... -> /...
    location /portal-sio/ {
        rewrite ^/portal-sio/(.*)$ /$1 permanent;
    }

    # Todo va al contenedor del frontend (docker-compose.yml, puerto 8082)
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
